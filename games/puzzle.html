<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle — NevaGames</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --gold:#f2c14e; --green:#3fb950;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(circle at 50% -10%,#1b2430 0%,#0d1117 60%),
      var(--bg);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:16px; user-select:none; touch-action:manipulation;
    animation:pageIn .5s ease both;
  }
  @keyframes pageIn{from{opacity:0}to{opacity:1}}
  #app{width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px}

  header h1{
    margin:0; font-size:18px; letter-spacing:.16em; text-transform:uppercase;
    background:linear-gradient(100deg,var(--txt) 30%,var(--gold) 50%,var(--txt) 70%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 5s linear infinite;
  }
  @keyframes shimmer{to{background-position:-220% 0}}
  header a{display:inline-block;font-size:12px;color:var(--dim);text-decoration:none;margin-bottom:6px}
  header p{margin:4px 0 0; font-size:12px; color:var(--dim); animation:rise .5s .1s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* ---------- Cadre + plateau ---------- */
  .frame{
    padding:10px; border-radius:16px;
    background:linear-gradient(135deg,#243b55 0%,#1b2f45 35%,#16263a 65%,#22405e 100%);
    box-shadow:0 14px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
    animation:rise .5s .15s ease both;
  }
  #board{
    position:relative; aspect-ratio:1/1; width:100%;
    border-radius:10px; overflow:hidden; background:#0a0e14;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 4px 18px rgba(0,0,0,.45);
    touch-action:manipulation;
  }
  .tile{
    position:absolute; top:0; left:0;
    background-repeat:no-repeat;
    border-radius:6px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 2px 6px rgba(0,0,0,.45);
    cursor:pointer;
    transition:transform .18s cubic-bezier(.25,.85,.35,1.06), filter .15s, box-shadow .2s;
    will-change:transform;
  }
  .tile:hover{filter:brightness(1.12)}
  .tile.deal{animation:deal .42s cubic-bezier(.2,.9,.3,1.25) both}
  @keyframes deal{
    from{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.5)}
    to{opacity:1; transform:translate(var(--tx),var(--ty)) scale(1)}
  }
  .tile.land{animation:land .3s ease}
  @keyframes land{0%{filter:brightness(1.7)}100%{filter:brightness(1)}}
  .tile.ok{
    box-shadow:inset 0 0 0 2px var(--gold), 0 0 16px rgba(242,193,78,.55);
  }
  .tile.bad{animation:shake .3s ease}
  @keyframes shake{0%,100%{margin-left:0}25%{margin-left:-5px}75%{margin-left:5px}}

  .spark{
    position:absolute; z-index:6; width:7px; height:7px; border-radius:50%;
    background:var(--gold); pointer-events:none;
    animation:burst .7s ease-out forwards;
  }
  @keyframes burst{
    from{opacity:1; transform:translate(0,0) scale(1)}
    to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2)}
  }

  /* ---------- HUD ---------- */
  .hud{display:flex; flex-direction:column; gap:10px; animation:rise .5s .25s ease both}
  .status{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:13px; min-height:42px; display:flex;
    align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .status.win{color:var(--gold); border-color:var(--gold)}
  .msg-in{display:inline-block; animation:msgIn .3s ease}
  @keyframes msgIn{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}
  .turn{display:inline-flex; align-items:center; gap:7px}
  .turn-dot{width:9px;height:9px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950;animation:dotPulse 1.6s ease-in-out infinite}
  .turn-dot.busy{background:#d29922; box-shadow:0 0 8px #d29922}
  @keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
  .counts{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);white-space:nowrap}

  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  button{
    font:inherit; font-size:12px; padding:8px 12px; color:var(--txt);
    background:linear-gradient(#2a3138,#21262d); border:1px solid var(--border); border-radius:8px;
    cursor:pointer; transition:transform .1s, background .15s, box-shadow .15s;
  }
  button:hover{background:#30363d; box-shadow:0 2px 8px rgba(0,0,0,.35)}
  button:active{transform:scale(.96)}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{opacity:.4; cursor:default; transform:none}
  .grow{flex:1}
  #newGame{background:linear-gradient(#2ea043,#238636); border-color:#2ea043; font-weight:600}
  #newGame:hover{background:linear-gradient(#3fb950,#2ea043)}

  .seg{display:inline-flex; gap:4px; background:#0d1117; border:1px solid var(--border); border-radius:9px; padding:3px}
  .seg button{border:0; background:none; padding:6px 10px; border-radius:6px; box-shadow:none}
  .seg button:hover{background:#21262d; box-shadow:none}
  .seg button.on{background:var(--accent); color:#04121f; font-weight:700}

  .thumbs{display:flex; gap:7px; align-items:center}
  .thumb{
    width:34px; height:34px; border-radius:7px; padding:0;
    background-size:cover; background-position:center;
    border:2px solid var(--border); box-shadow:none;
  }
  .thumb.on{border-color:var(--gold); box-shadow:0 0 10px rgba(242,193,78,.5)}
  .thumb:hover{transform:translateY(-2px)}

  /* ---------- Overlay ---------- */
  #overlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(5,8,12,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  #overlay.show{display:flex; animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #overlay .card{
    background:linear-gradient(#1c2530,#141a21);
    border:1px solid var(--gold); border-radius:18px; padding:28px 30px;
    text-align:center; max-width:340px; width:100%;
    box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 40px rgba(242,193,78,.15);
    animation:cardIn .5s cubic-bezier(.2,.9,.3,1.25);
  }
  @keyframes cardIn{from{opacity:0; transform:scale(.7) translateY(24px)}to{opacity:1; transform:none}}
  #overlay .trophy{font-size:52px; animation:trophyIn .7s .15s cubic-bezier(.2,.9,.3,1.4) both}
  @keyframes trophyIn{from{opacity:0; transform:scale(0) rotate(-20deg)}to{opacity:1; transform:scale(1) rotate(0)}}
  #overlay h2{margin:12px 0 6px; font-size:22px; color:var(--txt)}
  #overlay p{margin:0 0 18px; color:var(--dim); font-size:13px}
  #overlay .row{display:flex; gap:8px}
  #overlay .row button{flex:1; padding:11px}
  .confetti{position:fixed; top:-14px; z-index:51; pointer-events:none; border-radius:2px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.9}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="#" id="backToMenu">← Retour au menu</a>
    <h1>Puzzle</h1>
    <p>Remettez l'image dans le bon ordre — glissez les tuiles dans la case vide.</p>
  </header>

  <div class="frame"><div id="board" aria-label="puzzle"></div></div>

  <div class="hud">
    <div class="status" id="status">
      <span class="turn"><span class="turn-dot" id="turnDot"></span><span id="msg">Choisissez une image puis lancez.</span></span>
      <span class="counts" id="counts"></span>
    </div>

    <div class="controls">
      <span class="thumbs" id="thumbs" aria-label="image"></span>
      <span class="seg" id="sizeSeg" role="group" aria-label="taille">
        <button type="button" data-n="3">3×3</button>
        <button type="button" data-n="4" class="on">4×4</button>
        <button type="button" data-n="5">5×5</button>
      </span>
    </div>

    <div class="controls">
      <button id="sound" aria-label="son" title="Son on/off">🔊</button>
      <button id="undo" disabled>Annuler</button>
      <button id="newGame" class="grow">Nouvelle partie</button>
    </div>
  </div>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="victoire">
  <div class="card">
    <div class="trophy" id="trophy">🏆</div>
    <h2 id="endTitle">Résolu !</h2>
    <p id="endSub"></p>
    <div class="row"><button id="again">Rejouer</button></div>
  </div>
</div>

<script src="../shared/ng.js"></script>
<script>window.NG=window.NG||{bump:function(){},max:function(){},min:function(){},set:function(){},get:function(){return{}},settings:function(){return{sound:true,level:"4"}},setSetting:function(){}};</script>
<script>
"use strict";
// ================== DONNÉES ==================
const IMAGES = [
  { src:'assets/puzzle-1.jpg', name:'Image 1' },
  { src:'assets/puzzle-2.jpg', name:'Image 2' },
  { src:'assets/puzzle-3.jpg', name:'Image 3' }
];
const EMPTY = -1;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const state = {
  n:4, img:0, cells:[], moves:0, started:false, won:false,
  t0:0, elapsed:0, history:[], muted:false, timer:null
};

const boardEl = document.getElementById('board');
const msgEl = document.getElementById('msg');
const countsEl = document.getElementById('counts');
const turnDot = document.getElementById('turnDot');
const statusEl = document.getElementById('status');
const undoEl = document.getElementById('undo');
let tiles = {};   // tileId -> element (persistant : indispensable aux transitions)

/* ================== SON (WebAudio, aucun asset) ================== */
let actx = null;
function tone(freq, delay, dur, type, vol){
  if(state.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + (delay||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx = {
  select(){ tone(660,0,.07,'sine',.07); },
  step(){ tone(430,0,.07,'triangle',.09); },
  bad(){ tone(150,0,.12,'square',.05); },
  correct(){ tone(880,0,.06,'sine',.07); tone(1174,.05,.1,'sine',.06); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,'triangle',.11)); }
};

/* ================== LOGIQUE ================== */
function solvedCells(n){
  const a = [];
  for(let i=0;i<n*n-1;i++) a.push(i);
  a.push(EMPTY);
  return a;
}
function isSolved(){
  for(let i=0;i<state.cells.length-1;i++) if(state.cells[i]!==i) return false;
  return true;
}
function emptyIndex(){ return state.cells.indexOf(EMPTY); }

function neighbors(i){
  const n=state.n, r=(i/n)|0, c=i%n, out=[];
  if(r>0) out.push(i-n);
  if(r<n-1) out.push(i+n);
  if(c>0) out.push(i-1);
  if(c<n-1) out.push(i+1);
  return out;
}

/* Mélange par marches aléatoires depuis la solution : toujours résoluble. */
function shuffle(){
  const n = state.n;
  state.cells = solvedCells(n);
  let empty = n*n-1, last = -1;
  const steps = 220*n;
  for(let k=0;k<steps;k++){
    const cand = neighbors(empty).filter(x => x!==last);
    const pick = cand[(Math.random()*cand.length)|0];
    last = empty;
    const tmp = state.cells[empty];
    state.cells[empty] = state.cells[pick];
    state.cells[pick] = tmp;
    empty = pick;
  }
  if(isSolved()) shuffle();
}

function fmtTime(s){
  const m = (s/60)|0, r = s%60;
  return m+':'+String(r).padStart(2,'0');
}

/* ================== PLATEAU ================== */
function place(el, idx){
  const n = state.n;
  const tileId = parseInt(el.dataset.home, 10);
  const ir = (tileId/n)|0, ic = tileId % n;      // rattachement dans l'image
  const tr = (idx/n)|0,  tc = idx % n;           // case occupée
  el.style.transform = 'translate('+(tc*100)+'%,'+(tr*100)+'%)';
  el.style.setProperty('--tx', (tc*100)+'%');
  el.style.setProperty('--ty', (tr*100)+'%');
  el.style.backgroundPosition = ((ic/(n-1))*100)+'% '+((ir/(n-1))*100)+'%';
}

function positionAll(){
  for(let idx=0; idx<state.cells.length; idx++){
    const id = state.cells[idx];
    if(id === EMPTY) continue;
    if(tiles[id]) place(tiles[id], idx);
  }
}

function buildBoard(deal){
  const n = state.n;
  tiles = {};
  boardEl.replaceChildren();
  for(let id=0; id<n*n-1; id++){
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.home = id;
    el.style.width  = (100/n)+'%';
    el.style.height = (100/n)+'%';
    el.style.backgroundImage = 'url('+IMAGES[state.img].src+')';
    el.style.backgroundSize  = (n*100)+'% '+(n*100)+'%';
    boardEl.appendChild(el);
    tiles[id] = el;
  }
  positionAll();
  if(deal && !reducedMotion){
    let k = 0;
    Object.keys(tiles).forEach(id=>{
      const el = tiles[id];
      el.classList.remove('deal');
      void el.offsetWidth;
      el.classList.add('deal');
      el.style.animationDelay = ((k++)*24)+'ms';
    });
  }
}

function burst(idx){
  if(reducedMotion) return;
  const n = state.n, r = (idx/n)|0, c = idx%n;
  const x = (c+0.5)*(100/n), y = (r+0.5)*(100/n);
  for(let k=0;k<10;k++){
    const s = document.createElement('div');
    s.className = 'spark';
    const a = (Math.PI*2*k)/10 + Math.random()*.4;
    const d = 30 + Math.random()*26;
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.left = x+'%'; s.style.top = y+'%';
    boardEl.appendChild(s);
    setTimeout(()=>s.remove(), 750);
  }
}

/* ================== COUP ================== */
function moveTile(from){
  const empty = emptyIndex();
  if(state.cells[from] === EMPTY) return false;
  if(!neighbors(from).includes(empty)) return false;

  state.history.push({ cells: state.cells.slice(), moves: state.moves });
  if(state.history.length > 500) state.history.shift();

  const movedId = state.cells[from];
  state.cells[empty] = movedId;
  state.cells[from] = EMPTY;
  state.moves++;

  if(!state.started){
    state.started = true;
    state.t0 = Date.now();
    startTimer();
  }

  // les deux tuiles concernées changent de place (transition CSS)
  place(tiles[movedId], empty);
  updateHud();

  const el = tiles[movedId];
  el.classList.remove('land'); void el.offsetWidth; el.classList.add('land');
  sfx.step();

  if(empty === movedId){            // remise en place : baguette + étincelle
    el.classList.add('ok');
    burst(empty);
    sfx.correct();
  }

  undoEl.disabled = state.history.length === 0;
  checkWin();
  return true;
}

function checkWin(){
  if(!isSolved()) return;
  state.won = true;
  stopTimer();
  Object.keys(tiles).forEach(id=>tiles[id].classList.add('ok'));
  updateHud();
  const secs = Math.max(1, Math.round((Date.now()-state.t0)/1000));
  state.elapsed = secs;               // le compteur affiché est exact au moment de la victoire
  updateHud();
  try{
    NG.bump('puzzle','victoires',1);
    NG.min('puzzle','meilleurTemps',secs);
    NG.min('puzzle','moinsDeCoups',state.moves);
  }catch(e){}
  setTimeout(showOverlay, reducedMotion?0:500);
}

/* ================== HUD ================== */
function setMsg(html){
  msgEl.innerHTML = '';
  const s = document.createElement('span');
  s.className = 'msg-in';
  s.innerHTML = html;
  msgEl.appendChild(s);
}
function countsText(){
  return fmtTime(state.elapsed)+' · '+state.moves+' coups · '+state.n+'×'+state.n;
}
function updateHud(){
  countsEl.textContent = countsText();
  statusEl.classList.toggle('win', state.won);
  turnDot.classList.toggle('busy', !state.won && !state.started);
  let msg;
  if(state.won) msg = '<b>Résolu en '+fmtTime(state.elapsed)+'</b> — '+state.moves+' coups.';
  else if(!state.started) msg = 'Cliquez une tuile voisine de la case vide.';
  else msg = 'À vous de jouer.';
  setMsg(msg);
  undoEl.disabled = state.history.length === 0 || state.won;
}
function startTimer(){
  stopTimer();
  state.timer = setInterval(()=>{
    if(state.won || !state.started) return;
    state.elapsed = Math.max(1, Math.round((Date.now()-state.t0)/1000));
    countsEl.textContent = countsText();
  }, 500);
}
function stopTimer(){ if(state.timer){ clearInterval(state.timer); state.timer = null; } }

/* ================== PARTIE ================== */
function newGame(){
  hideOverlay();
  state.moves = 0; state.elapsed = 0;
  state.started = false; state.won = false;
  state.history = [];
  stopTimer();
  shuffle();
  try{ NG.bump('puzzle','parties',1); }catch(e){}
  buildBoard(true);
  updateHud();
}

function undo(){
  if(!state.history.length || state.won) return;
  const h = state.history.pop();
  state.cells = h.cells;
  state.moves = h.moves;
  positionAll();
  Object.keys(tiles).forEach(id=>tiles[id].classList.remove('ok'));
  sfx.select();
  updateHud();
}

/* ================== INTERACTIONS ================== */
boardEl.addEventListener('click', e=>{
  const tile = e.target.closest('.tile');
  if(!tile || state.won) return;
  const id = parseInt(tile.dataset.home, 10);
  const idx = state.cells.indexOf(id);
  if(idx < 0) return;
  if(!neighbors(idx).includes(emptyIndex())){
    tile.classList.remove('bad'); void tile.offsetWidth; tile.classList.add('bad');
    sfx.bad();
    return;
  }
  moveTile(idx);
});

document.getElementById('newGame').addEventListener('click', newGame);
document.getElementById('again').addEventListener('click', newGame);
undoEl.addEventListener('click', undo);

document.getElementById('sound').addEventListener('click', e=>{
  state.muted = !state.muted;
  e.target.textContent = state.muted ? '🔇' : '🔊';
  e.target.title = state.muted ? 'Son coupé' : 'Son activé';
  try{ NG.setSetting('sound', !state.muted); }catch(err){}
});

document.getElementById('sizeSeg').addEventListener('click', e=>{
  const b = e.target.closest('[data-n]'); if(!b) return;
  state.n = parseInt(b.dataset.n, 10);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.classList.toggle('on', x===b));
  sfx.select();
  newGame();
});

const thumbsEl = document.getElementById('thumbs');
IMAGES.forEach((im,i)=>{
  const b = document.createElement('button');
  b.className = 'thumb' + (i===0 ? ' on' : '');
  b.type = 'button';
  b.style.backgroundImage = 'url('+im.src+')';
  b.title = im.name;
  b.setAttribute('aria-label', im.name);
  b.addEventListener('click', ()=>{
    state.img = i;
    thumbsEl.querySelectorAll('.thumb').forEach((x,k)=>x.classList.toggle('on', k===i));
    sfx.select();
    newGame();
  });
  thumbsEl.appendChild(b);
});

document.getElementById('backToMenu').addEventListener('click', function(e){
  e.preventDefault();
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({ng:'back'},'*'); return; } }catch(err){}
  history.back();
});

/* ================== OVERLAY ================== */
function showOverlay(){
  if(document.getElementById('overlay').classList.contains('show')) return;
  document.getElementById('trophy').textContent = '🏆';
  document.getElementById('endTitle').textContent = 'Résolu !';
  document.getElementById('endSub').textContent =
    fmtTime(state.elapsed)+' · '+state.moves+' coups · '+state.n+'×'+state.n;
  document.getElementById('overlay').classList.add('show');
  sfx.win();
  confetti();
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function confetti(){
  if(reducedMotion) return;
  const colors = ['#f2c14e','#58a6ff','#3fb950','#ff7b72','#bc8cff','#fff'];
  for(let i=0;i<80;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const sz = 5 + Math.random()*7;
    c.style.left = (Math.random()*100)+'vw';
    c.style.width = sz+'px'; c.style.height = (sz*0.5+3)+'px';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2.4+Math.random()*2.2)+'s';
    c.style.animationDelay = (Math.random()*0.9)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5500);
  }
}

/* ================== INIT ================== */
try{
  if(NG.settings().sound === false){
    state.muted = true;
    document.getElementById('sound').textContent = '🔇';
  }
}catch(e){}
newGame();
</script>
</body>
</html>
