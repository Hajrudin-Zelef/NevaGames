name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le jeu et l'icône
        run: |
          mkdir -p www assets
          cp blackjack.html www/index.html
          cp icon.png assets/icon-only.png

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f3d2a' --iconBackgroundColorDark '#0f3d2a'

      - name: Vérifier l'icône adaptative
        run: |
          set -e
          FG=android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          BG=android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          XML=android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f "$FG" || { echo "ERREUR: ic_launcher_foreground.png non généré"; exit 1; }
          test -f "$BG" || { echo "ERREUR: ic_launcher_background.png non généré"; exit 1; }
          grep -q "ic_launcher_background" "$XML" || { echo "ERREUR: XML adaptatif non mis à jour"; exit 1; }
          echo "Icône adaptative OK"

      - name: Synchroniser le jeu
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
